pre-commit:
  parallel: true
  commands:
    documentation:
      run: node scripts/check-docs.mjs --staged
    whitespace:
      run: git diff --cached --check
    requirement-copy:
      run: node scripts/check-requirement-copy.mjs --staged
    lint:
      glob: '*.{js,mjs,ts,tsx,css,json}'
      run: npm run lint
    privacy:
      run: node scripts/check-privacy.mjs

commit-msg:
  commands:
    conventional:
      run: ./node_modules/.bin/commitlint --edit {1}

pre-push:
  commands:
    privacy-history:
      run: node scripts/check-privacy.mjs --history
    check:
      glob: '*.{js,mjs,ts,tsx,css,json,yml,yaml}'
      run: npm run check
